name: Previsão diária de chuva

on:
  schedule:
    - cron: "30 2 * * *"      # 02:30 UTC = 23:30 em Brasília (dia de hoje quase completo no INMET)
  workflow_dispatch:           # permite rodar manualmente pela aba Actions

permissions:
  contents: write

concurrency:
  group: previsao
  cancel-in-progress: false

jobs:
  prever:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Coletar medições do INMET
        run: python coletar_inmet.py

      - name: Gerar previsão
        run: python previsao_diaria.py

      - name: Guardar diagnóstico da coleta
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-coleta-inmet
          path: dados/diagnostico/
          retention-days: 7
          if-no-files-found: ignore

      - name: Publicar resultado
        if: always()           # publica também o status de erro, para o dashboard avisar
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data dados/inmet_A568_horario.csv dados/importar
          git diff --cached --quiet || git commit -m "Previsão $(TZ=America/Sao_Paulo date +%F)"
          git push
