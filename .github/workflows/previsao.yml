name: Previsão diária de chuva

on:
  schedule:
    # De hora em hora (minuto 17 para fugir do pico do minuto 0). O GitHub atrasa ou pula
    # disparos agendados com frequência; rodar a cada hora reduz o tempo sem atualização.
    # Cada execução coleta o INMET; a previsão só é recalculada quando chegam medições novas
    # ou quando ainda não existe previsão com base no dia de hoje.
    - cron: "17 * * * *"
  workflow_dispatch:           # permite rodar manualmente pela aba Actions

permissions:
  contents: write

concurrency:
  group: previsao
  cancel-in-progress: false

jobs:
  prever:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Coletar medições do INMET
        run: python coletar_inmet.py

      - name: Verificar se há dados novos
        id: novos
        run: |
          HOJE=$(TZ=America/Sao_Paulo date +%F)
          LIDO=$(python -c "import json; p=json.load(open('docs/data/previsao.json')); print(p.get('data_base',''), p.get('status',''))" 2>/dev/null || echo "")
          if [ -n "$(git status --porcelain -- dados/inmet_A568_horario.csv dados/importar)" ]; then
            MOTIVO="medições novas do INMET"
          elif [ "$LIDO" != "$HOJE ok" ]; then
            MOTIVO="ainda não há previsão válida com base em hoje"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MOTIVO="execução manual"
          fi
          if [ -n "$MOTIVO" ]; then
            echo "Recalcular: $MOTIVO"
            echo "rodar=true" >> "$GITHUB_OUTPUT"
          else
            echo "Sem medições novas desde a última previsão; nada a recalcular."
            echo "rodar=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Gerar previsão
        if: steps.novos.outputs.rodar == 'true'
        run: python previsao_diaria.py

      - name: Guardar diagnóstico da coleta
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-coleta-inmet
          path: dados/diagnostico/
          retention-days: 7
          if-no-files-found: ignore

      - name: Publicar resultado
        if: always()           # publica também o status de erro, para o dashboard avisar
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data dados/inmet_A568_horario.csv dados/importar
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Previsão $(TZ=America/Sao_Paulo date '+%F %H:%M')"
          git pull --rebase --autostash   # caso você tenha enviado algum arquivo durante a execução
          git push
