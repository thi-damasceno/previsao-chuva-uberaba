name: Previsão diária de chuva

on:
  schedule:
    - cron: "10 23 * * *"     # 23:10 UTC = 20:10 em Brasília
  workflow_dispatch:           # permite rodar manualmente pela aba Actions

permissions:
  contents: write

concurrency:
  group: previsao
  cancel-in-progress: false

jobs:
  prever:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar previsão
        run: python previsao_diaria.py

      - name: Publicar resultado
        if: always()           # publica também o status de erro, para o dashboard avisar
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Previsão $(TZ=America/Sao_Paulo date +%F)"
          git push
